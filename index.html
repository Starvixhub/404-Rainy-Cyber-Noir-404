<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Lost in the Rain</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="sky"></div>

        <div class="moon"></div>

        <div class="city">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="neon neon-pink">
            <span>404</span>
        </div>

        <div class="neon neon-blue">
            <span>LOST</span>
        </div>

        <div class="rain" id="rain"></div>

        <section class="content">

            <div class="status">
                <span class="status-dot"></span>
                SIGNAL LOST
            </div>

            <h1>
                404
            </h1>

            <h2>
                Lost in the Rain
            </h2>

            <p>
                The page you're looking for has disappeared
                somewhere between the midnight streets and
                the falling rain.
            </p>

            <button id="homeButton">
                <span>↩</span>
                Find Your Way Home
            </button>

        </section>

        <div class="road">

            <div class="reflection reflection-1">
                404
            </div>

            <div class="reflection reflection-2">
                LOST
            </div>

        </div>

        <div class="mist mist-1"></div>
        <div class="mist mist-2"></div>

        <div class="street-light"></div>

        <footer>
            THE CITY NEVER SLEEPS
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
